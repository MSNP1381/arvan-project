[project]
name = "arvan-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MSNP1381", email = "mohamadnematpoor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",
    "langgraph-api>=0.15.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "tqdm>=4.66.0",
    "pypdf>=6.19.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
]

[project.scripts]
arvan-project = "arvan_project:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
